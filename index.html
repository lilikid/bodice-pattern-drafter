<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bodice Pattern Drafter</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #1e293b;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .pattern-grid-line { fill: none; stroke: #e2e8f0; stroke-width: 1; }
    .pattern-main-line { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linejoin: round; }
    .pattern-dart-line { fill: none; stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 3,3; }
    .pattern-point { fill: #2563eb; r: 3; }
    .pattern-text { font-family: sans-serif; font-size: 10px; fill: #64748b; font-weight: 500; }

    @media print {
      svg#pattern-canvas {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div id="svg-container" style="width: 100%; overflow: auto;">
    <svg id="pattern-canvas" width="100cm" height="80cm" viewBox="0 0 1000 800">
      <g id="viewport">
        <g id="pattern-layer">
          <!-- 5cm x 5cm (50mm x 50mm) True-Scale Print Verification Box -->
          <rect x="10" y="10" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="sidebar-footer">
    <button class="btn-primary" onclick="exportSVG()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Export Pattern SVG
    </button>
  </div>

<script>
  let isDragging = false;

  function updateTransform() {
    // Pan and zoom transform handling
  }

  window.addEventListener('mouseup', () => isDragging = false);

  function exportSVG() {
    const svgData = document.getElementById('pattern-canvas').outerHTML;
    const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
    const svgUrl = URL.createObjectURL(svgBlob);
    const downloadLink = document.createElement("a");
    downloadLink.href = svgUrl;
    downloadLink.download = "bodice_pattern.svg";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
  }

  function drawPattern() {
    // Dynamic pattern drafting calculations go here
  }

  // Initial Load
  drawPattern();
</script>
</body>
</html>
